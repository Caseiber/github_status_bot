[project]
name = "github-status-bot"
version = "0.1.0"
description = "Slack bot that reports GitHub's operational status on demand"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.21",
    "slack-sdk>=3.34",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-httpx>=0.35",
    "pytest-cov>=6.1",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
    "boto3-stubs[secretsmanager,dynamodb,cloudwatch]>=1.38",
    "moto[dynamodb]>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_status_bot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"
markers = ["integration: live network/AWS calls (deselect with -m 'not integration')"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
