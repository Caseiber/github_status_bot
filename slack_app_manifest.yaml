display_information:
  name: Github Status Bot
  description: Tag to check whether GitHub is down
  background_color: "#2d2e30"
features:
  bot_user:
    display_name: Github Status Bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  is_mcp_enabled: false
